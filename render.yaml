services:
  - type: web
    name: rabota-rf-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rabota-rf-db
          property: connectionString

databases:
  - name: rabota-rf-db
    databaseName: rabotarf
    user: rabotarf

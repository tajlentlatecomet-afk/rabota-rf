<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>РаботаРФ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f6f8fc;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--blue:#2563eb;--blue2:#1d4ed8;--green:#16a34a;--red:#dc2626;--shadow:0 16px 40px rgba(15,23,42,.08);--radius:22px}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(180deg,#f8fbff,#eef3ff);color:var(--text)}body.dark{--bg:#0f172a;--card:#111827;--text:#f8fafc;--muted:#94a3b8;--line:#263244;background:#0f172a}.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.dark .top{background:rgba(15,23,42,.86)}.bar{max-width:1180px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:24px;font-weight:800;color:var(--blue);cursor:pointer;letter-spacing:-.04em}.nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.nav button,.btn{border:0;border-radius:14px;padding:10px 16px;font-weight:700;cursor:pointer;background:#eef2ff;color:#1e40af}.nav button:hover,.btn:hover{transform:translateY(-1px)}.btn.primary{background:var(--blue);color:white}.btn.green{background:var(--green);color:white}.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.hero{max-width:1180px;margin:30px auto 0;padding:46px 20px}.heroBox{background:radial-gradient(circle at top left,#dbeafe,#fff 45%,#eff6ff);border:1px solid white;border-radius:34px;padding:52px;box-shadow:var(--shadow)}.dark .heroBox{background:linear-gradient(135deg,#172554,#111827)}h1{font-size:52px;line-height:1;margin:0 0 14px;letter-spacing:-.06em}p{color:var(--muted);line-height:1.6}.search{display:flex;gap:10px;margin-top:28px;max-width:720px}.input,textarea,select{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);font:inherit}textarea{min-height:105px;resize:vertical}.wrap{max-width:1180px;margin:auto;padding:20px}.sectionTitle{display:flex;align-items:end;justify-content:space-between;margin:22px 0 14px}.sectionTitle h2{margin:0;font-size:24px;letter-spacing:-.03em}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}.job{cursor:pointer;transition:.18s}.job:hover{transform:translateY(-3px)}.jobTitle{font-size:18px;font-weight:800;margin-bottom:8px}.company{color:var(--blue);font-weight:700}.salary{margin:12px 0;font-weight:800}.tags{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tag{font-size:12px;font-weight:700;color:#1d4ed8;background:#dbeafe;padding:5px 9px;border-radius:999px}.actions{display:flex;gap:8px;flex-wrap:wrap}.page{display:none}.page.active{display:block}.form{max-width:480px;margin:38px auto}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{padding:11px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;font-weight:800;color:var(--text)}.tab.active{background:var(--blue);color:#fff}.notice{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:14px 18px;border-radius:16px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s}.notice.show{opacity:1}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.list{display:flex;flex-direction:column;gap:12px}.pill{display:inline-flex;padding:6px 10px;border-radius:999px;background:#fff7ed;color:#c2410c;font-weight:800;font-size:12px}.pagination{display:flex;gap:8px;justify-content:center;margin:22px}.chat{height:470px;display:grid;grid-template-columns:190px 1fr;overflow:hidden}.contacts{border-right:1px solid var(--line);overflow:auto}.contact{padding:14px;cursor:pointer;border-bottom:1px solid var(--line);font-weight:700}.contact.active{background:#dbeafe;color:#1d4ed8}.messages{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:10px}.bubble{max-width:72%;padding:10px 13px;border-radius:16px;background:#e5e7eb}.bubble.me{align-self:flex-end;background:var(--blue);color:white}.chatInput{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.footer{text-align:center;color:var(--muted);padding:35px}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:720px){h1{font-size:34px}.heroBox{padding:28px}.search,.row{grid-template-columns:1fr;display:grid}.chat{grid-template-columns:1fr}.contacts{display:flex;border-right:0;border-bottom:1px solid var(--line)}}
  </style>
</head>
<body>
<header class="top"><div class="bar"><div class="brand" onclick="showPage('home')">РаботаРФ</div><div class="nav"><button onclick="showPage('home')">Вакансии</button><button onclick="showPage('companies')">Компании</button><button id="cabBtn" onclick="showPage('cabinet')" style="display:none">Кабинет</button><button onclick="toggleTheme()">Тема</button><button id="loginBtn" class="btn primary" onclick="showPage('login')">Войти</button><button id="logoutBtn" class="btn primary" onclick="logout()" style="display:none">Выйти</button></div></div></header>

<main>
<section id="home" class="page active"><div class="hero"><div class="heroBox"><h1>Работа мечты ближе, чем кажется</h1><p>Вакансии, резюме, отклики и кабинет работодателя в одном месте.</p><div class="search"><input id="searchInput" class="input" placeholder="Должность, компания, навык"><button class="btn primary" onclick="searchJobs()">Найти</button></div><div style="margin-top:16px"><button class="btn green" onclick="showPage('register')">Создать аккаунт</button></div></div></div><div class="wrap"><div class="sectionTitle"><h2>Вакансии дня</h2><span id="jobsCount"></span></div><div id="jobs" class="grid"></div><div id="pages" class="pagination"></div></div></section>

<section id="companies" class="page"><div class="wrap"><div class="sectionTitle"><h2>Компании</h2></div><div id="companiesGrid" class="grid"></div></div></section>

<section id="register" class="page"><div class="wrap"><div class="card form"><h2>Регистрация</h2><div class="tabs"><button id="typeUser" class="tab active" onclick="setType('iskatel')">Ищу работу</button><button id="typeEmployer" class="tab" onclick="setType('rabotodatel')">Работодатель</button></div><div class="row"><input id="rName" class="input" placeholder="Имя"><input id="rLast" class="input" placeholder="Фамилия"></div><br><input id="rEmail" class="input" placeholder="Email"><br><br><input id="rPhone" class="input" placeholder="Телефон"><br><br><input id="rPass" class="input" type="password" placeholder="Пароль"><br><br><button class="btn primary" style="width:100%" onclick="register()">Зарегистрироваться</button><p><span style="cursor:pointer;color:var(--blue)" onclick="showPage('login')">Уже есть аккаунт? Войти</span></p></div></div></section>

<section id="login" class="page"><div class="wrap"><div class="card form"><h2>Вход</h2><input id="lEmail" class="input" placeholder="Email"><br><br><input id="lPass" class="input" type="password" placeholder="Пароль"><br><br><button class="btn primary" style="width:100%" onclick="login()">Войти</button><p><span style="cursor:pointer;color:var(--blue)" onclick="showPage('register')">Нет аккаунта? Регистрация</span></p></div></div></section>

<section id="jobPage" class="page"><div class="wrap"><button class="btn ghost" onclick="showPage('home')">← Назад</button><div id="jobDetail" class="card" style="margin-top:16px"></div></div></section>

<section id="cabinet" class="page"><div class="wrap"><div class="sectionTitle"><h2>Личный кабинет</h2><span id="userInfo"></span></div><div id="cabTabs" class="tabs"></div><div id="cabContent"></div></div></section>
</main>

<div class="footer">© 2026 РаботаРФ</div><div id="notice" class="notice"></div>

<script>
const BEKEND_URL = "https://rabota-rf.onrender.com";
let token = localStorage.getItem('token');
let user = JSON.parse(localStorage.getItem('user') || 'null');
let accountType = 'iskatel';
let currentPage = 1;
let lastQuery = '';
let currentChat = 'Яндекс';

function notify(t){const n=document.getElementById('notice');n.textContent=t;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),2500)}
function authHeaders(){return token ? {'Authorization':'Bearer '+token} : {}}
async function api(path, opts={}){const res=await fetch(BEKEND_URL+path,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{}),...(opts.auth?authHeaders():{})}});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.detail||'Ошибка сервера');return data}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);if(id==='companies')loadCompanies();if(id==='cabinet')loadCabinet()}
function refreshNav(){const logged=!!token&&!!user;loginBtn.style.display=logged?'none':'';logoutBtn.style.display=logged?'':'none';cabBtn.style.display=logged?'':'none';if(user)userInfo.textContent=user.imya+' · '+(user.tip==='rabotodatel'?'Работодатель':'Соискатель')}
function toggleTheme(){document.body.classList.toggle('dark')}
function setType(t){accountType=t;typeUser.classList.toggle('active',t==='iskatel');typeEmployer.classList.toggle('active',t==='rabotodatel')}
async function register(){try{const data=await api('/registratsiya',{method:'POST',body:JSON.stringify({imya:rName.value,familiya:rLast.value,email:rEmail.value,telefon:rPhone.value,parol:rPass.value,tip:accountType})});token=data.token;user=data;localStorage.setItem('token',token);localStorage.setItem('user',JSON.stringify(user));refreshNav();showPage('cabinet');notify('Готово, аккаунт создан')}catch(e){notify(e.message)}}
async function login(){try{const data=await api('/vhod',{method:'POST',body:JSON.stringify({email:lEmail.value,parol:lPass.value})});token=data.token;user=data;localStorage.setItem('token',token);localStorage.setItem('user',JSON.stringify(user));refreshNav();showPage('home');notify('Вы вошли')}catch(e){notify(e.message)}}
function logout(){token=null;user=null;localStorage.clear();refreshNav();showPage('home');notify('Вы вышли')}
async function loadJobs(page=1,q=''){try{currentPage=page;lastQuery=q;const data=await api(`/vakansii?stranitsa=${page}&razmer=9${q?'&poisk='+encodeURIComponent(q):''}`);jobsCount.textContent=`${data.vsego} найдено`;jobs.innerHTML=data.vakansii.map(jobCard).join('')||'<div class="empty">Вакансии не найдены</div>';renderPages(data.vsego_stranits)}catch(e){jobs.innerHTML='<div class="empty">Не удалось загрузить вакансии. Проверь BEKEND_URL.</div>'}}
function searchJobs(){loadJobs(1,searchInput.value.trim())}
function renderPages(total){pages.innerHTML='';if(total<=1)return;for(let i=1;i<=total;i++){const b=document.createElement('button');b.className='btn '+(i===currentPage?'primary':'ghost');b.textContent=i;b.onclick=()=>loadJobs(i,lastQuery);pages.appendChild(b)}}
function jobCard(v){const tags=(v.tegi||'').split(',').filter(Boolean).map(t=>`<span class="tag">${t.trim()}</span>`).join('');return `<div class="card job" onclick="openJob(${v.id})"><div class="jobTitle">${v.logo||'🏢'} ${v.nazvanie}</div><div class="company">${v.kompaniya}</div><div class="salary">${v.zarplata}</div><div class="tags">${tags}</div><div class="actions"><button class="btn primary" onclick="applyJob(${v.id},event)">Откликнуться</button><button class="btn ghost" onclick="likeJob(${v.id},event)">+1</button><button class="btn ghost" onclick="favJob(${v.id},event)">♥</button></div></div>`}
async function openJob(id){try{const v=await api('/vakansii/'+id);jobDetail.innerHTML=`<h2>${v.logo||'🏢'} ${v.nazvanie}</h2><p class="company">${v.kompaniya}</p><h3>${v.zarplata}</h3><p><b>Режим:</b> ${v.rezhim}</p><p>${v.opisanie}</p><h3>Требования</h3><ul>${(v.trebovaniya||'').split(',').filter(Boolean).map(x=>`<li>${x.trim()}</li>`).join('')}</ul><button class="btn primary" onclick="applyJob(${v.id},event)">Откликнуться</button>`;showPage('jobPage')}catch(e){notify(e.message)}}
async function applyJob(id,e){if(e)e.stopPropagation();if(!token){showPage('login');return}try{await api('/otkliki',{method:'POST',auth:true,body:JSON.stringify({vakansiya_id:id})});notify('Отклик отправлен')}catch(err){notify(err.message)}}
async function likeJob(id,e){e.stopPropagation();if(!token){showPage('login');return}try{await api('/lajki/'+id,{method:'POST',auth:true});notify('Лайк сохранён')}catch(err){notify(err.message)}}
async function favJob(id,e){e.stopPropagation();if(!token){showPage('login');return}try{await api('/izbrannye/'+id,{method:'POST',auth:true});notify('Избранное обновлено')}catch(err){notify(err.message)}}
async function loadCompanies(){try{const data=await api('/kompanii');companiesGrid.innerHTML=data.map(k=>`<div class="card"><h2>${k.logo||'🏢'}</h2><h3>${k.nazvanie}</h3><p>${k.opisanie}</p><span class="tag">${k.vakansij_count} вакансий</span></div>`).join('')}catch(e){companiesGrid.innerHTML='<div class="empty">Ошибка загрузки</div>'}}
function tabBtn(id,name,active=false){return `<button class="tab ${active?'active':''}" onclick="cabTab('${id}')">${name}</button>`}
function loadCabinet(){if(!token){showPage('login');return}const emp=user.tip==='rabotodatel';cabTabs.innerHTML=emp?[tabBtn('myJobs','Мои вакансии',true),tabBtn('chat','Чат'),tabBtn('profile','Профиль')].join(''):[tabBtn('resume','Резюме',true),tabBtn('responses','Отклики'),tabBtn('favorites','Избранное'),tabBtn('chat','Чат'),tabBtn('review','Отзывы'),tabBtn('profile','Профиль')].join('');cabTab(emp?'myJobs':'resume')}
function setActiveTab(id){document.querySelectorAll('#cabTabs .tab').forEach(b=>b.classList.remove('active'));[...document.querySelectorAll('#cabTabs .tab')].find(b=>b.getAttribute('onclick').includes(id))?.classList.add('active')}
function cabTab(id){setActiveTab(id);if(id==='resume')resumeView();if(id==='responses')responsesView();if(id==='favorites')favoritesView();if(id==='chat')chatView();if(id==='review')reviewView();if(id==='profile')profileView();if(id==='myJobs')myJobsView()}
function resumeView(){cabContent.innerHTML=`<div class="card"><h2>Моё резюме</h2><input id="rez1" class="input" placeholder="Должность"><br><br><input id="rez2" class="input" placeholder="Город"><br><br><input id="rez3" class="input" placeholder="Зарплата"><br><br><textarea id="rez4" placeholder="О себе"></textarea><br><br><textarea id="rez5" placeholder="Опыт"></textarea><br><br><textarea id="rez6" placeholder="Образование"></textarea><br><br><input id="rez7" class="input" placeholder="Навыки"><br><br><button class="btn primary" onclick="saveResume()">Сохранить</button></div>`;api('/rezyume/moe',{auth:true}).then(r=>{rez1.value=r.dolzhnost||'';rez2.value=r.gorod||'';rez3.value=r.zarplata||'';rez4.value=r.o_sebe||'';rez5.value=r.opyt||'';rez6.value=r.obrazovanie||'';rez7.value=r.navyki||''}).catch(()=>{})}
async function saveResume(){try{await api('/rezyume',{method:'POST',auth:true,body:JSON.stringify({dolzhnost:rez1.value,gorod:rez2.value,zarplata:rez3.value,o_sebe:rez4.value,opyt:rez5.value,obrazovanie:rez6.value,navyki:rez7.value})});notify('Резюме сохранено')}catch(e){notify(e.message)}}
async function responsesView(){cabContent.innerHTML='<div class="card empty">Загрузка...</div>';try{const a=await api('/otkliki/moi',{auth:true});cabContent.innerHTML=`<div class="list">${a.map(o=>`<div class="card"><b>${o.nazvanie}</b><p>${o.kompaniya}</p><span class="pill">${o.status}</span></div>`).join('')||'<div class="card empty">Откликов пока нет</div>'}</div>`}catch(e){notify(e.message)}}
async function favoritesView(){try{const ids=await api('/izbrannye/moi',{auth:true});const arr=[];for(const id of ids){arr.push(await api('/vakansii/'+id))}cabContent.innerHTML=`<div class="grid">${arr.map(jobCard).join('')||'<div class="card empty">Избранное пусто</div>'}</div>`}catch(e){notify(e.message)}}
function chatView(){cabContent.innerHTML=`<div class="card chat"><div class="contacts">${['Яндекс','Сбер','Авито','Поддержка'].map(x=>`<div class="contact ${x===currentChat?'active':''}" onclick="currentChat='${x}';chatView()">${x}</div>`).join('')}</div><div><div id="msgs" class="messages"></div><div class="chatInput"><input id="chatText" class="input" placeholder="Сообщение"><button class="btn primary" onclick="sendChat()">Отправить</button></div></div></div>`;loadChat()}
async function loadChat(){try{const a=await api('/chat/soobshcheniya?komu_kompaniya='+encodeURIComponent(currentChat),{auth:true});msgs.innerHTML=(a.length?a:[{tekst:'Здравствуйте! Чем можем помочь?',ot_kogo:'bot'}]).map(m=>`<div class="bubble ${m.ot_kogo==='user'?'me':''}">${m.tekst}</div>`).join('')}catch(e){msgs.innerHTML='<div class="bubble">Чат готов</div>'}}
async function sendChat(){if(!chatText.value.trim())return;try{await api('/chat/otpravit',{method:'POST',auth:true,body:JSON.stringify({komu_kompaniya:currentChat,tekst:chatText.value})});chatText.value='';loadChat()}catch(e){notify(e.message)}}
function reviewView(){cabContent.innerHTML=`<div class="card"><h2>Отзыв о компании</h2><input id="revCompany" class="input" placeholder="Компания"><br><br><textarea id="revText" placeholder="Текст отзыва"></textarea><br><br><select id="revStars"><option value="5">5 звёзд</option><option value="4">4 звезды</option><option value="3">3 звезды</option><option value="2">2 звезды</option><option value="1">1 звезда</option></select><br><br><button class="btn primary" onclick="sendReview()">Отправить</button></div>`}
async function sendReview(){try{await api('/otzyvy',{method:'POST',auth:true,body:JSON.stringify({kompaniya:revCompany.value,tekst:revText.value,zvezdy:Number(revStars.value)})});notify('Отзыв отправлен')}catch(e){notify(e.message)}}
function profileView(){cabContent.innerHTML=`<div class="card"><h2>Профиль</h2><p><b>${user.imya}</b> · ${user.email}</p><input id="pPhone" class="input" placeholder="Телефон" value="${user.telefon||''}"><br><br><input id="pBirth" class="input" placeholder="Дата рождения"><br><br><textarea id="pAbout" placeholder="О себе"></textarea><br><br><button class="btn primary" onclick="saveProfile()">Сохранить</button></div>`}
async function saveProfile(){try{await api('/profil',{method:'PUT',auth:true,body:JSON.stringify({telefon:pPhone.value,data_rozhdeniya:pBirth.value,o_sebe:pAbout.value})});user.telefon=pPhone.value;localStorage.setItem('user',JSON.stringify(user));refreshNav();notify('Профиль сохранён')}catch(e){notify(e.message)}}
function myJobsView(){cabContent.innerHTML=`<div class="card"><h2>Добавить вакансию</h2><input id="j1" class="input" placeholder="Название"><br><br><input id="j2" class="input" placeholder="Компания"><br><br><input id="j3" class="input" placeholder="Зарплата"><br><br><select id="j4"><option>Офис</option><option>Удалённо</option><option>Гибрид</option></select><br><br><textarea id="j5" placeholder="Описание"></textarea><br><br><input id="j6" class="input" placeholder="Требования через запятую"><br><br><input id="j7" class="input" placeholder="Теги через запятую"><br><br><button class="btn primary" onclick="addJob()">Опубликовать</button></div><div class="sectionTitle"><h2>Мои вакансии</h2></div><div id="myJobs" class="list"></div>`;loadMyJobs()}
async function addJob(){try{await api('/vakansii',{method:'POST',auth:true,body:JSON.stringify({nazvanie:j1.value,kompaniya:j2.value,zarplata:j3.value,rezhim:j4.value,opisanie:j5.value,trebovaniya:j6.value,tegi:j7.value})});notify('Вакансия опубликована');myJobsView();loadJobs()}catch(e){notify(e.message)}}
async function loadMyJobs(){try{const a=await api('/moi_vakansii',{auth:true});myJobs.innerHTML=a.map(v=>`<div class="card"><b>${v.nazvanie}</b><p>${v.zarplata}</p><button class="btn ghost" onclick="deleteJob(${v.id})">Удалить</button></div>`).join('')||'<div class="card empty">Пока нет вакансий</div>'}catch(e){myJobs.innerHTML='<div class="card empty">Ошибка загрузки</div>'}}
async function deleteJob(id){try{await api('/vakansii/'+id,{method:'DELETE',auth:true});notify('Удалено');loadMyJobs()}catch(e){notify(e.message)}}
refreshNav();loadJobs();
</script>
</body>
</html>
